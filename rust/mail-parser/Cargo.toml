[package]
name = "mail-parser"
version = "0.1.0"
edition = "2021"
description = "Fast MIME mail parser for Temp Mail v2 (turjaun.xyz) - WASM for Cloudflare Workers and Node.js, rlib for native Rust use"
license = "MIT"

[lib]
name = "mail_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
